<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRONG — Bet Detail</title>
<style>
  :root { --bg: #0a0a1a; --card: #12122a; --border: #1e1e3a; --text: #e0e0e0; --dim: #777;
           --mono: 'SF Mono', 'Menlo', 'Monaco', monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         font-size:13px; padding:20px; max-width:1100px; margin:0 auto; }
  a { color:#ffd700; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;
             padding-bottom:16px; border-bottom:1px solid var(--border); }
  .tier-name { font-size:24px; font-weight:700; color:#ffd700; }
  .back-link { font-size:12px; color:var(--dim); }
  .stats { display:flex; gap:24px; margin-bottom:24px; flex-wrap:wrap; }
  .stat-box { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 20px;
               min-width:100px; text-align:center; }
  .stat-val { font-size:20px; font-weight:700; font-family:var(--mono); }
  .stat-lbl { font-size:10px; color:var(--dim); margin-top:4px; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:12px; font-family:var(--mono); }
  th { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
       text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  td { padding:6px; border-bottom:1px solid #111; white-space:nowrap; }
  tr:hover { background:#1a1a2e; }
  .dim { color:var(--dim); }
  .profit-pos { color:#00ff88; }
  .profit-neg { color:#ff4444; }
</style>
</head>
<body>
  <div class="header">
    <div>
      <div class="tier-name">STRONG</div>
      <div class="dim" style="margin-top:4px">2026 Season · 0 bets</div>
    </div>
    <a class="back-link" href="dashboard.html">← Back to Dashboard</a>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-val">0</div>
      <div class="stat-lbl">Total Bets</div>
    </div>
    <div class="stat-box">
      <div class="stat-val">0-0</div>
      <div class="stat-lbl">W-L</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" style="color:#00ff88">+0.0u</div>
      <div class="stat-lbl">Profit</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" style="color:#00ff88">+0.0%</div>
      <div class="stat-lbl">ROI</div>
    </div>
    <div class="stat-box">
      <div class="stat-val">0</div>
      <div class="stat-lbl">Pending</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th><th>Game</th><th>Side</th>
        <th style="text-align:right">Model</th>
        <th style="text-align:right">Vegas</th>
        <th style="text-align:right">Edge</th>
        <th style="text-align:right">Stake</th>
        <th style="text-align:right">Result</th>
        <th style="text-align:right">P&L</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody><tr><td colspan="10" style="text-align:center;padding:32px;color:#666">No bets recorded for this tier yet</td></tr></tbody>
  </table>

  <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border);color:var(--dim);font-size:10px;text-align:center">
    Generated 2026-04-01 · All figures use modal de-vigged odds
  </div>
</body>
</html>
